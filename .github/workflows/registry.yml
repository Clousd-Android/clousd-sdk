name: registry

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  mcp-registry:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar -xz -C /tmp mcp-publisher
          sudo mv /tmp/mcp-publisher /usr/local/bin/
      - run: mcp-publisher login github-oidc
      - run: mcp-publisher publish
