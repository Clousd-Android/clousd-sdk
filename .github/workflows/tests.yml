name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e python
      - run: python -m unittest discover -s python/tests -v
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e python -e mcp
      - run: python -c "import clousd_mcp.server as s; print('tools:', len(s.mcp._tool_manager.list_tools()) if hasattr(s.mcp, '_tool_manager') else 'ok')"
