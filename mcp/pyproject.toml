[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clousd-mcp"
version = "0.1.1"
description = "MCP server: give an AI agent a real Android phone in the cloud"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2.0", "clousd>=0.1.0"]
keywords = ["mcp", "android", "cloud phone", "ai agents", "mobile automation"]

[project.scripts]
clousd-mcp = "clousd_mcp.server:main"

[project.urls]
Homepage = "https://clousd.com/agents/"

[tool.setuptools]
packages = ["clousd_mcp"]
